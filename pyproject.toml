[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-capabilities"
version = "0.1.0"
description = "LLM-discovered, deterministically replayed UI capabilities for legacy back-office applications (interface.ai take-home)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "playwright>=1.45",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
uicap = "ui_capabilities.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# import the working tree, not a stale installed copy
pythonpath = ["src", "."]
markers = [
    "integration: tests that launch the demo app and a real (headless) browser",
]
