<!DOCTYPE html>
<html>
<head>
<title>{% block title %}MERIDIAN Capability Dashboard{% endblock %}</title>
<style>
 body { font-family: monospace; margin: 20px; background: #f5f5f0; color: #111; }
 nav { margin-bottom: 16px; }
 nav a { margin-right: 14px; }
 table { border-collapse: collapse; width: 100%; max-width: 1100px; background: #fff; }
 th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; vertical-align: top; font-size: 0.92em; }
 th { background: #eee; }
 .card { border: 1px solid #888; background: #fff; padding: 12px; margin-bottom: 12px; max-width: 1100px; }
 .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.85em; color: #fff; }
 .status-success { background: #2a7; }
 .status-business_outcome { background: #b90; }
 .status-failure { background: #c33; }
 .status-escalated { background: #649; }
 .risk-safe, .risk-reversible { background: #567; }
 .risk-risky { background: #b90; }
 .risk-irreversible { background: #c33; }
 .mono { font-family: monospace; }
 img.evidence { max-width: 480px; border: 1px solid #aaa; margin: 4px 0; }
 ul.evidence-list { padding-left: 18px; }
 .events { max-height: 320px; overflow-y: auto; background: #fafafa; border: 1px solid #ddd; padding: 8px; font-size: 0.85em; }
</style>
</head>
<body>
<nav>
  <a href="/dashboard">Capability Catalog</a>
  <a href="/dashboard/runs">Run History</a>
  <a href="/chatbot">Chatbot</a>
  <a href="/docs">API docs</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
