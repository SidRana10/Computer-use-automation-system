<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MERIDIAN Assistant</title>
<style>
  :root {
    --bg: #eef1f5;
    --card-bg: #ffffff;
    --border: #d8dee6;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #1d4ed8;
    --accent-soft: #e8effe;
    --user-bubble: #1d4ed8;
    --user-bubble-text: #ffffff;
    --bot-bubble: #f3f4f6;
    --bot-bubble-text: #1f2937;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  header.app-header {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .app-header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .subtitle {
    margin: 2px 0 0;
    font-size: 0.875rem;
    color: var(--muted);
  }
  nav.app-nav {
    display: flex;
    gap: 14px;
    font-size: 0.8rem;
  }
  nav.app-nav a {
    color: var(--muted);
    text-decoration: none;
  }
  nav.app-nav a:hover, nav.app-nav a:focus-visible {
    color: var(--accent);
    text-decoration: underline;
  }
  .arch-note {
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 0.75rem;
    color: var(--muted);
  }
  .chat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #log {
    /* A fixed, stable scroll viewport. Each .msg is `flex-shrink: 0`
       (below) so messages keep their natural content height and never get
       vertically compressed as history grows — #log itself scrolls
       instead. */
    height: 520px;
    min-height: 520px;
    max-height: 520px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.875rem;
    padding: 24px;
    max-width: 30ch;
  }
  .msg {
    flex-shrink: 0;
    max-width: 88%;
    padding: 10px 13px;
    border-radius: 14px;
    font-family: var(--mono);
    font-size: 0.83rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.me {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    max-width: 92%;
    background: var(--bot-bubble);
    color: var(--bot-bubble-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    overflow-x: auto;
  }
  .msg.bot.error {
    background: #fef2f2;
    border-color: #fecaca;
    color: #991b1b;
  }
  .chips {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: #fafbfc;
  }
  .chip {
    font-family: var(--sans);
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  .chip:hover, .chip:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }
  form#composer {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  #input {
    flex: 1;
    min-width: 0;
    font-family: var(--sans);
    font-size: 0.9rem;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #f9fafb;
    color: var(--text);
  }
  #input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button[type=submit] {
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button[type=submit]:hover { background: #1e40af; }
  button[type=submit]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[type=submit]:disabled { background: #93a5c9; cursor: not-allowed; }
  @media (max-width: 480px) {
    .msg { max-width: 96%; }
    h1 { font-size: 1.1rem; }
    #log { height: 55vh; min-height: 320px; max-height: 55vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-top">
      <div>
        <h1>MERIDIAN Assistant</h1>
        <p class="subtitle">Capability-powered member servicing</p>
      </div>
      <nav class="app-nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/docs">API Docs</a>
      </nav>
    </div>
    <p class="arch-note">Powered by the MERIDIAN Capability API · No direct browser control</p>
  </header>

  <div class="chat-card">
    <div id="log">
      <p class="empty-state">Ask about a member, balances, transfers, or other servicing tasks below.</p>
    </div>
    <div class="chips" id="chips">
      <button type="button" class="chip" data-prompt="Find member Lovelace">Find a member</button>
      <button type="button" class="chip" data-prompt="Check the balances for member 100234">Check balances</button>
      <button type="button" class="chip" data-prompt="Transfer money for member 100234">Transfer funds</button>
      <button type="button" class="chip" data-prompt="Update the address for member 100234">Update member</button>
    </div>
    <form id="composer">
      <input type="text" id="input" autocomplete="off" placeholder="Ask MERIDIAN about a member or servicing task…">
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<script>
let sessionId = null;
const log = document.getElementById('log');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const chips = document.getElementById('chips');
const sendButton = form.querySelector('button[type=submit]');

function clearEmptyState() {
  const empty = log.querySelector('.empty-state');
  if (empty) empty.remove();
}

function append(who, text, isError) {
  clearEmptyState();
  const div = document.createElement('div');
  div.className = 'msg ' + who + (isError ? ' error' : '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

chips.addEventListener('click', (event) => {
  const chip = event.target.closest('.chip');
  if (!chip) return;
  input.value = chip.dataset.prompt || '';
  input.focus();
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  append('me', text);
  input.value = '';
  sendButton.disabled = true;
  try {
    const response = await fetch('/chatbot/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    // An uncaught server-side exception returns a plain-text body (e.g.
    // FastAPI's own "Internal Server Error"), not JSON — read as text
    // first and parse defensively so that case shows a clean message
    // instead of a raw SyntaxError from a blind response.json() call.
    const raw = await response.text();
    let data = null;
    try {
      data = JSON.parse(raw);
    } catch (parseErr) {
      data = null;
    }
    if (!response.ok || !data || typeof data.reply !== 'string') {
      append('bot', 'The capability request failed unexpectedly. Check the run/server logs.', true);
    } else {
      sessionId = data.session_id;
      // The reply text already carries the run id and dashboard path as
      // secondary metadata (see router.py::_run_metadata) — no separate
      // "run: ... (status: ...)" line needed here.
      append('bot', data.reply);
    }
  } catch (err) {
    append('bot', 'Request failed: ' + err, true);
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
